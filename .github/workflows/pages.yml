name: Web-Version (GitHub Pages)

# Baut die Schalttafel als reine Web-App und veröffentlicht sie auf GitHub Pages.
# Die Windows- und Android-Builds sind davon unabhängig; GITHUB_PAGES_BASE wird nur hier gesetzt.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-Version bauen
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npx vite build

      - name: Pages-Ausgabe vorbereiten
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
