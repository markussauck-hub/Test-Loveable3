name: Android-Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Android-NDK einrichten
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Android-Projekt erzeugen
        run: |
          npx tauri android init --ci
          npx tauri icon src-tauri/app-icon.svg -o src-tauri/icons

      - name: APK bauen
        run: npx tauri android build --apk --target aarch64

      - name: APK signieren
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -n1)
          echo "Unsigniert: $UNSIGNED"
          test -n "$UNSIGNED"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/schalttafel.jks"
          mkdir -p out
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/schalttafel.jks" --ks-key-alias schalttafel --ks-pass env:KS_PASS --key-pass env:KS_PASS --out out/Schalttafel.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/schalttafel.jks"

      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Schalttafel-Android
          path: out/Schalttafel.apk
          if-no-files-found: error
